name: offirst_dr_screening
description: Offline experimental DR screening demo using the supplied OFFIRST ONNX export.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
  image: 4.2.0
  image_picker: 1.2.4
  onnxruntime: 1.4.1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offirst_dr_model.onnx
